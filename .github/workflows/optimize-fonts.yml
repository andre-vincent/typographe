name: Optimisation automatique des polices

on:
  push:
    paths:
      - 'src/fonts/src/**'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer les dépendances
        run: |
          pip install fonttools brotli

      - name: Exécuter le script Python
        run: |
          python subset-fonts.py

      # Étape de vérification pour s'assurer que les fichiers WOFF2 ont été générés
      - name: Vérifier les fichiers générés
        run: |
          echo "=== Contenu du dossier de sortie ==="
          if [ -d "public/fonts" ]; then
            ls -la public/fonts
          else
            echo "❌ Erreur : Le dossier public/fonts n'a pas été créé."
            exit 1
          fi

      - name: Enregistrer les modifications sur GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: polices optimisées automatiquement en WOFF2 [skip ci]"
          file_pattern: 'public/fonts/*.woff2'
          disable_globbing: false
