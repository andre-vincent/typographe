name: Optimisation automatique des polices

on:
  push:
    paths:
      - 'src/fonts/src/**'
  workflow_dispatch: 

permissions:
  contents: write # Important pour donner le droit d'écrire sur votre GitHub

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: |
          pip install fonttools brotli

      - name: Exécuter votre script Python
        run: |
          python subset-fonts.py

      - name: Enregistrer les modifications sur GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: polices optimisées automatiquement en WOFF2"
          # CORRECTION 1 : On demande à Git d'ajouter tout le contenu du dossier plutôt qu'un filtre strict
          file_pattern: 'public/fonts/'
          # CORRECTION 2 : Désactive le bug d'analyse des dossiers vides au démarrage
          disable_globbing: true
