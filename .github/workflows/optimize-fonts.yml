name: Optimisation automatique des polices

on:
  push:
    paths:
      - 'src/fonts/src/**'
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4
        with:
          # 💡 CRUCIAL : Force GitHub à se positionner sur la branche principale
          # pour permettre l'écriture des fichiers.
          ref: main 

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: |
          pip install fonttools brotli

      - name: Exécuter votre script Python (Chemin Absolu)
        run: |
          cd $GITHUB_WORKSPACE
          python subset-fonts.py

      - name: Enregistrer les modifications sur GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: polices optimisées automatiquement en WOFF2"
          file_pattern: 'public/fonts/*.woff2'
          # 💡 SÉCURITÉ : On spécifie explicitement la branche de destination
          branch: main
