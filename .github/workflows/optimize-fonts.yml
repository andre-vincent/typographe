name: Optimisation automatique des polices

on:
  push:
    paths:
      - 'src/fonts/src/**'
  workflow_dispatch: 

permissions:
  contents: write # Autorise explicitement l'écriture sur le dépôt

jobs:
  optimize:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code du projet
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }} # Se positionne dynamiquement sur la bonne branche

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Installer les dépendances
        run: |
          pip install fonttools brotli

      - name: Exécuter le script Python
        run: |
          python subset-fonts.py

      - name: Enregistrer les modifications sur GitHub
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: polices optimisées automatiquement en WOFF2"
          file_pattern: 'public/fonts/*.woff2'
